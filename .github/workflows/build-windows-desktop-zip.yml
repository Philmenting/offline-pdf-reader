name: Build Windows Desktop Zip

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: windows-desktop-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows desktop ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system ZIP tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build ONLYOFFICE PDF editor engine
        run: npm run build-engine

      - name: Generate font registry
        run: npm run generate-fonts

      - name: Build Windows desktop ZIP
        run: npm run dist:win

      - name: Upload Windows desktop ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Offline-PDF-Editor-Windows-Zip
          path: dist/Offline-PDF-Editor.zip
          if-no-files-found: error
          retention-days: 14
