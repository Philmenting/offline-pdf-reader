name: Build Windows Desktop ZIP

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.3); empty = v<package.json version>"
        required: false
        default: ""

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve build metadata
        id: meta
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          RELEASE_TAG=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
            if [ -z "$RELEASE_TAG" ]; then
              RELEASE_TAG="v$VERSION"
            fi
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          fi

          if [ "$HEAD_MESSAGE" = "Publish v0.8.0 and clean historical builds" ] && [ "$GITHUB_REF" = "refs/heads/master" ]; then
            test "$VERSION" = "0.8.0"
            if git rev-parse --verify refs/tags/v0.8.0 >/dev/null 2>&1; then
              echo "Tag v0.8.0 already exists. Refusing to replace it."
              exit 1
            fi
            RELEASE_TAG="v0.8.0"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_label=v$VERSION-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Build: v$VERSION-$SHORT_SHA"
          if [ -n "$RELEASE_TAG" ]; then
            echo "Release: $RELEASE_TAG"
          fi

      - name: Generate changelog
        shell: bash
        run: |
          git fetch --tags --force
          RELEASE_TAG="${{ steps.meta.outputs.release_tag }}"
          PREV=$(git tag --list 'v*' --sort=-v:refname \
            | grep -v "^$RELEASE_TAG$" | head -1)
          echo "## Änderungen" > release-notes.md
          echo "" >> release-notes.md
          echo "Build aus Commit \`${{ github.sha }}\`." >> release-notes.md
          echo "" >> release-notes.md
          if [ -n "$PREV" ] && git rev-parse "$PREV" >/dev/null 2>&1; then
            echo "Seit $PREV:" >> release-notes.md
            echo "" >> release-notes.md
            git log --no-merges --pretty='* %s' "$PREV"..HEAD >> release-notes.md
          else
            git log --no-merges --pretty='* %s' -20 >> release-notes.md
          fi
          cat release-notes.md

      - name: Use curated release notes
        if: github.event.head_commit.message == 'Publish v0.8.0 and clean historical builds' && github.ref == 'refs/heads/master'
        run: |
          cp RELEASE_NOTES.md release-notes.md
          printf '\nBuild aus Commit `%s`.\n' "$GITHUB_SHA" >> release-notes.md

      - name: Build ONLYOFFICE PDF engine
        run: npm run build-engine

      - name: Generate font registry
        run: npm run generate-fonts

      - name: Fetch OCR stack
        run: npm run fetch-ocr

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright pdf-lib
          npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm test

      - name: Build Windows desktop package
        run: npm run dist:win

      - name: Build Windows installer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          npm run dist:win:installer

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: Offline-PDF-Editor-${{ steps.meta.outputs.build_label }}
          path: |
            dist/Offline-PDF-Editor-Setup.exe
            dist/Offline-PDF-Editor.zip
          if-no-files-found: error
          retention-days: 30

      - name: Update continuous test tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          git tag -f continuous "$GITHUB_SHA"
          git push origin refs/tags/continuous --force

      - name: Publish current test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: "Offline PDF Editor Testbuild aktuell"
          prerelease: true
          make_latest: false
          overwrite_files: true
          body_path: release-notes.md
          files: |
            dist/Offline-PDF-Editor-Setup.exe
            dist/Offline-PDF-Editor.zip

      - name: Publish version release
        if: steps.meta.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: "Offline PDF Editor ${{ steps.meta.outputs.release_tag }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body_path: release-notes.md
          files: |
            dist/Offline-PDF-Editor-Setup.exe
            dist/Offline-PDF-Editor.zip

      - name: Clean historical releases and workflow runs once
        if: github.event.head_commit.message == 'Publish v0.8.0 and clean historical builds' && github.ref == 'refs/heads/master'
        uses: actions/github-script@v7
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            if (repo.owner !== 'Philmenting' || repo.repo !== 'offline-pdf-reader') {
              throw new Error('Cleanup is restricted to the explicitly requested repository.');
            }
            const head = await github.rest.git.getRef({ ...repo, ref: 'heads/master' });
            if (head.data.object.sha !== context.sha) throw new Error('Master moved. Cleanup stopped.');
            const release = (await github.rest.repos.getReleaseByTag({ ...repo, tag: 'v0.8.0' })).data;
            const tag = (await github.rest.git.getRef({ ...repo, ref: 'tags/v0.8.0' })).data;
            if (release.draft || release.prerelease || tag.object.sha !== context.sha ||
                !release.body.includes(context.sha)) throw new Error('Current release is not verified.');
