name: Build Windows Desktop ZIP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build ONLYOFFICE PDF engine
        run: npm run build-engine

      - name: Generate font registry
        run: npm run generate-fonts

      # Regression gate for the typed-text artifact bug (ASCW3 / .notdef
      # boxes): types into a subset-font PDF and asserts real glyphs come out.
      # Runs BEFORE packaging so a broken font stack can never ship.
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Typing smoke test
        run: npm test

      - name: Build Windows desktop package
        run: npm run dist:win

      - name: Build Windows installer (NSIS)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
          npm run dist:win:installer

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Offline-PDF-Editor-Setup.exe
            dist/Offline-PDF-Editor.zip
          generate_release_notes: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Offline PDF Editor ${{ env.RELEASE_TAG }}"
