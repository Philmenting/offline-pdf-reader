name: Build Windows Desktop ZIP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build ONLYOFFICE PDF engine
        run: npm run build-engine

      - name: Generate font registry
        run: npm run generate-fonts

      - name: Build Windows desktop package
        run: npm run dist:win

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Offline-PDF-Editor.zip
          generate_release_notes: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Offline PDF Editor ${{ env.RELEASE_TAG }}"
