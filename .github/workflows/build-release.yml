343915076,"tag":"v0.1.5"},{"id":343911859,"tag":"v0.1.4"},{"id":343909070,"tag":"v0.1.3"},{"id":343906896,"tag":"v0.1.2"},{"id":343902630,"tag":"v0.1.1"},{"id":343900623,"tag":"master"}];
            const oldRuns = [34975298972,34958849087,34958286803,34953229111,34331379855,34328598074,34317523992,31677344371,31677299228,30905319014,30902215825,30900777554,30900752837,30900712933,30900686378,30900656035,30891990260,30891961664,30891919138,30891897444,30891865862,30890112249,30890086914,30890057648,30890033354,30803767384,30803734095,30803699419,30801071400,30797712957,30797565112,30795797260,30795360878,30793852251,30791778874,30791776546,30791773270,30544722427,30543111048,30543110614,30543107593,30543106283,30541279000,30541277442,30541274952,30539057272,30539056419,30539053827,30539052236,30539051274,30539049741,30539048463,30442326434,30442318286,30441475499,30441467329,30438242173,30437192636,30437176302,30431134646,29898440957,29898297004,29501823097,29490031243,29479117304,29475341347,29398671614,29397951303,29396499638,29395193230,29394678224,29349700588,29347965374];
            let deletedReleases = 0;
            let deletedRuns = 0;
            for (const old of oldReleases) {
              if (old.id === release.id) throw new Error('Cannot delete the current release.');
              try {
                const candidate = (await github.rest.repos.getRelease({ ...repo, release_id: old.id })).data;
                if (candidate.tag_name !== old.tag || candidate.tag_name === 'continuous') {
                  throw new Error('Release identity changed: ' + old.id);
                }
                await github.rest.repos.deleteRelease({ ...repo, release_id: old.id });
                deletedReleases++;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            for (const run_id of oldRuns) {
              if (run_id === context.runId) throw new Error('Cannot delete the current run.');
              try {
                const candidate = (await github.rest.actions.getWorkflowRun({ ...repo, run_id })).data;
                if (candidate.status !== 'completed') throw new Error('Old run is still active: ' + run_id);
                await github.rest.actions.deleteWorkflowRun({ ...repo, run_id });
                deletedRuns++;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await core.summary.addHeading('Repository cleanup')
              .addRaw('Published v0.8.0. Kept the current run and continuous test download.\n')
              .addRaw('Deleted releases: ' + deletedReleases + '. Deleted runs: ' + deletedRuns + '.\n')
              .addRaw('Source history and git tags were not deleted.').write();
