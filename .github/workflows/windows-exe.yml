name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Tesseract (bundle for portable OCR)
        shell: powershell
        run: |
          choco install tesseract --no-progress -y
          if (!(Test-Path "C:\Program Files\Tesseract-OCR\tesseract.exe")) {
            throw "Tesseract installation failed"
          }

      - name: Prepare bundled runtime files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "bundle/tesseract" | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR\*" "bundle/tesseract" -Recurse -Force

      - name: Build EXE (PyInstaller onedir + bundled Tesseract)
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --onedir --name offline-pdf-reader --add-data "bundle/tesseract;tesseract" app.py

      - name: Package portable build as ZIP
        shell: powershell
        run: |
          $zipName = "offline-pdf-reader-windows-portable.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "dist/offline-pdf-reader/*" -DestinationPath $zipName -Force

      - name: Publish/overwrite nightly release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          make_latest: false
          files: offline-pdf-reader-windows-portable.zip
          overwrite_files: true
          generate_release_notes: false
          body: |
            Auto-updated nightly Windows portable build.
            This release is overwritten until the first stable version is published.
