name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Tesseract (bundle for portable OCR)
        shell: powershell
        run: |
          choco install tesseract --no-progress -y
          if (!(Test-Path "C:\Program Files\Tesseract-OCR\tesseract.exe")) {
            throw "Tesseract installation failed"
          }

      - name: Prepare bundled runtime files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "bundle/tesseract" | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR\*" "bundle/tesseract" -Recurse -Force

      - name: Build EXE (PyInstaller onedir + bundled Tesseract)
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --onedir --name offline-pdf-reader --add-data "bundle/tesseract;tesseract" app.py

      - name: Cleanup old workflow artifacts (keep latest 3)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const targetName = 'offline-pdf-reader-windows-portable';
            const keep = 3;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const matching = artifacts
              .filter(a => a.name === targetName && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const toDelete = matching.slice(keep);
            core.info(`Found ${matching.length} artifacts named ${targetName}; deleting ${toDelete.length}.`);

            for (const artifact of toDelete) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted artifact ${artifact.id} (${artifact.created_at})`);
            }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-pdf-reader-windows-portable
          path: dist/offline-pdf-reader
          retention-days: 2
