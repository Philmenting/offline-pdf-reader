<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline PDF Editor</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">PDF</span>
      <span class="brand-title">Offline PDF Editor</span>
    </div>

    <div class="toolbar" id="toolbar" aria-label="Werkzeugleiste">
      <div class="toolbar-row primary-row">
        <div class="toolbar-group file-group" aria-label="Datei">
          <span class="group-label">Datei</span>
          <div class="group-controls">
            <label class="btn primary-action" for="file-input" title="PDF öffnen (Strg+O)">Öffnen</label>
            <input id="file-input" type="file" accept="application/pdf" hidden>
            <button class="btn" id="btn-save" title="Bearbeitetes PDF speichern (Strg+S)" disabled>Speichern</button>
            <button class="btn compact" id="btn-print" title="Drucken (Strg+P)" disabled>Drucken</button>
          </div>
        </div>

        <div class="toolbar-group history-group" aria-label="Verlauf">
          <span class="group-label">Verlauf</span>
          <div class="group-controls segmented">
            <button class="btn icon-btn" data-tool="undo" title="Rückgängig" disabled>↶</button>
            <button class="btn icon-btn" data-tool="redo" title="Wiederholen" disabled>↷</button>
          </div>
        </div>

        <div class="toolbar-group mode-group" aria-label="Bearbeitungsmodus">
          <span class="group-label">Modus</span>
          <div class="group-controls segmented">
            <button class="btn tool" data-tool="select" title="Auswählen / Hand" disabled>Auswahl</button>
            <button class="btn tool" data-tool="edit-text" title="Text bearbeiten" disabled>Text</button>
            <button class="btn tool" data-tool="textbox" title="Textfeld einfügen" disabled>Textfeld</button>
            <button class="btn tool" data-tool="form-fill" title="Formular ausfüllen (Bearbeitung gesperrt, Felder ausfüllbar)" disabled>Ausfüllen</button>
          </div>
        </div>

        <div class="toolbar-group text-group" aria-label="Textformat">
          <span class="group-label">Textformat</span>
          <div class="group-controls text-controls">
            <select class="format-select" id="text-font-family" title="Schriftart" disabled>
              <option value="Liberation Sans">Liberation Sans</option>
              <option value="Liberation Serif">Liberation Serif</option>
              <option value="Liberation Mono">Liberation Mono</option>
              <option value="DejaVu Sans">DejaVu Sans</option>
              <option value="DejaVu Serif">DejaVu Serif</option>
              <option value="FreeSans">FreeSans</option>
              <option value="FreeSerif">FreeSerif</option>
              <option value="Carlito">Carlito</option>
              <option value="Caladea">Caladea</option>
              <option value="Arial">Arial</option>
              <option value="Times New Roman">Times New Roman</option>
              <option value="Courier New">Courier New</option>
            </select>
            <input class="format-size" id="text-font-size" type="number" min="6" max="96" step="0.5" value="12" title="Schriftgröße" disabled>
            <div class="segmented inline-format">
              <button class="btn icon-btn format-toggle" id="text-bold" type="button" title="Fett" aria-pressed="false" disabled>B</button>
              <button class="btn icon-btn format-toggle" id="text-italic" type="button" title="Kursiv" aria-pressed="false" disabled><i>K</i></button>
            </div>
            <label class="format-color-wrap" title="Textfarbe">
              <input type="color" id="text-color" value="#000000" disabled>
            </label>
          </div>
        </div>
      </div>

      <div class="toolbar-row secondary-row">
        <div class="toolbar-group annotation-group" aria-label="Annotationen">
          <span class="group-label">Annotationen</span>
          <div class="group-controls segmented">
            <button class="btn tool" data-tool="highlight" title="Markieren" disabled>Marker</button>
            <button class="btn tool icon-btn" data-tool="underline" title="Unterstreichen" disabled>U̲</button>
            <button class="btn tool icon-btn" data-tool="strikeout" title="Durchstreichen" disabled>S̶</button>
            <button class="btn tool" data-tool="shape" title="Form (Rechteck)" disabled>Form</button>
            <button class="btn tool" data-tool="comment" title="Kommentar" disabled>Notiz</button>
            <button class="btn tool" data-tool="image" title="Bild einfügen" disabled>Bild</button>
          </div>
        </div>

        <div class="toolbar-group page-group" aria-label="Seiten">
          <span class="group-label">Seiten</span>
          <div class="group-controls segmented">
            <button class="btn" data-tool="page-add" title="Seite hinzufügen" disabled>+ Seite</button>
            <button class="btn" data-tool="page-remove" title="Seite löschen" disabled>- Seite</button>
            <button class="btn" data-tool="pdf-append" title="Anderes PDF anhängen (Seiten ans Dokumentende)" disabled>+ PDF</button>
            <button class="btn icon-btn" data-tool="rotate-left" title="Seite links drehen" disabled>↺</button>
            <button class="btn icon-btn" data-tool="rotate-right" title="Seite rechts drehen" disabled>↻</button>
          </div>
        </div>

        <div class="toolbar-group view-group" aria-label="Ansicht">
          <span class="group-label">Ansicht</span>
          <div class="group-controls segmented">
            <button class="btn icon-btn" data-tool="zoom-out" title="Verkleinern" disabled>−</button>
            <button class="btn icon-btn" data-tool="zoom-in" title="Vergrößern" disabled>+</button>
            <button class="btn" data-tool="fit-width" title="An Breite anpassen" disabled>Breite</button>
            <button class="btn" data-tool="fit-page" title="Ganze Seite" disabled>Seite</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <!-- Editor thumbnails: the PDF editor (onDocumentContentReady) creates its
           ThumbnailsControl into an element with THIS exact id. Without it, the
           editor's Viewer.thumbnails stays null and asc_EditPage() crashes. -->
      <div id="thumbnails-list" class="thumbnails"></div>
      <!-- Viewer-fallback thumbnails (only used in read-only fallback mode). -->
      <div id="thumbnails" class="thumbnails" hidden></div>
    </aside>
    <section class="viewer-host">
      <!-- Floating search bar (Strg+F). Lives OUTSIDE #editor_sdk because the
           editor replaces that element's innerHTML. -->
      <div id="search-bar" class="search-bar" hidden>
        <input id="search-input" type="text" placeholder="Suchen …" spellcheck="false">
        <span id="search-count" class="search-count">0/0</span>
        <button id="search-prev" class="search-btn" title="Vorheriger Treffer (Umschalt+Enter)">▲</button>
        <button id="search-next" class="search-btn" title="Nächster Treffer (Enter / F3)">▼</button>
        <button id="search-close" class="search-btn" title="Schließen (Esc)">✕</button>
      </div>

      <!--
        The ONLYOFFICE PDF editor (Asc.PDFEditorApi) replaces this element's
        innerHTML with the full editor page DOM (id_main / id_viewer /
        id_target_cursor / scrollbars …). It must be present and empty before
        the API is constructed.
      -->
      <div id="editor_sdk" class="editor-host"></div>

      <!-- Read-only fallback mount (used only if the editor bundle is missing).
           Its #id_target_cursor is created at runtime to avoid colliding with
           the editor's own #id_target_cursor inside #editor_sdk. -->
      <div id="viewer-container" class="viewer" hidden></div>

      <div id="placeholder" class="placeholder">
        <p>Öffne eine PDF-Datei, um sie zu bearbeiten.</p>
        <p class="muted">Läuft vollständig offline — kein Server-Upload.</p>
      </div>
    </section>
  </main>

  <footer class="app-status" id="status">Engine wird geladen …</footer>

  <script src="/js/main.js" type="module"></script>
</body>
</html>
