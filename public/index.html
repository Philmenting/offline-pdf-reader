<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline PDF Editor</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">Offline PDF Editor</div>

    <div class="toolbar" id="toolbar">
      <!-- File -->
      <label class="btn" for="file-input">PDF öffnen</label>
      <input id="file-input" type="file" accept="application/pdf" hidden>
      <button class="btn" id="btn-save" title="Bearbeitetes PDF herunterladen" disabled>Speichern</button>

      <span class="sep"></span>

      <!-- History -->
      <button class="btn ghost" data-tool="undo" title="Rückgängig" disabled>↶</button>
      <button class="btn ghost" data-tool="redo" title="Wiederholen" disabled>↷</button>

      <span class="sep"></span>

      <!-- Edit tools (toggle group) -->
      <button class="btn ghost tool" data-tool="select"    title="Auswählen / Hand" disabled>Auswahl</button>
      <button class="btn ghost tool" data-tool="edit-text" title="Text bearbeiten" disabled>Text</button>
      <button class="btn ghost tool" data-tool="textbox"   title="Textfeld einfügen" disabled>Textfeld</button>
      <button class="btn ghost tool" data-tool="highlight" title="Markieren" disabled>Marker</button>
      <button class="btn ghost tool" data-tool="underline" title="Unterstreichen" disabled>U̲</button>
      <button class="btn ghost tool" data-tool="strikeout" title="Durchstreichen" disabled>S̶</button>
      <button class="btn ghost tool" data-tool="shape"     title="Form (Rechteck)" disabled>Form</button>
      <button class="btn ghost tool" data-tool="comment"   title="Kommentar" disabled>💬</button>
      <button class="btn ghost tool" data-tool="image"     title="Bild einfügen" disabled>Bild</button>

      <span class="sep"></span>

      <!-- Pages -->
      <button class="btn ghost" data-tool="page-add"    title="Seite hinzufügen" disabled>＋Seite</button>
      <button class="btn ghost" data-tool="page-remove" title="Seite löschen" disabled>－Seite</button>
      <button class="btn ghost" data-tool="rotate-left" title="Seite links drehen" disabled>↺</button>
      <button class="btn ghost" data-tool="rotate-right" title="Seite rechts drehen" disabled>↻</button>

      <span class="sep"></span>

      <!-- View -->
      <button class="btn ghost" data-tool="zoom-out"  title="Verkleinern" disabled>−</button>
      <button class="btn ghost" data-tool="zoom-in"   title="Vergrößern" disabled>+</button>
      <button class="btn ghost" data-tool="fit-width" title="An Breite anpassen" disabled>Breite</button>
      <button class="btn ghost" data-tool="fit-page"  title="Ganze Seite" disabled>Seite</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <!-- Editor thumbnails: the PDF editor (onDocumentContentReady) creates its
           ThumbnailsControl into an element with THIS exact id. Without it, the
           editor's Viewer.thumbnails stays null and asc_EditPage() crashes. -->
      <div id="thumbnails-list" class="thumbnails"></div>
      <!-- Viewer-fallback thumbnails (only used in read-only fallback mode). -->
      <div id="thumbnails" class="thumbnails" hidden></div>
    </aside>
    <section class="viewer-host">
      <!--
        The ONLYOFFICE PDF editor (Asc.PDFEditorApi) replaces this element's
        innerHTML with the full editor page DOM (id_main / id_viewer /
        id_target_cursor / scrollbars …). It must be present and empty before
        the API is constructed.
      -->
      <div id="editor_sdk" class="editor-host"></div>

      <!-- Read-only fallback mount (used only if the editor bundle is missing).
           Its #id_target_cursor is created at runtime to avoid colliding with
           the editor's own #id_target_cursor inside #editor_sdk. -->
      <div id="viewer-container" class="viewer" hidden></div>

      <div id="placeholder" class="placeholder">
        <p>Öffne eine PDF-Datei, um sie zu bearbeiten.</p>
        <p class="muted">Läuft vollständig offline — kein Server-Upload.</p>
      </div>
    </section>
  </main>

  <footer class="app-status" id="status">Engine wird geladen …</footer>

  <script src="/js/ascw3-font-fallback.js"></script>
  <script src="/js/main.js" type="module"></script>
</body>
</html>
