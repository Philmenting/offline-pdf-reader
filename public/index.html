<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline PDF Editor</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">Offline PDF Editor</div>
    <div class="toolbar">
      <label class="btn" for="file-input">PDF öffnen</label>
      <input id="file-input" type="file" accept="application/pdf" hidden>
      <span class="sep"></span>
      <button class="btn ghost" id="btn-zoom-out" title="Verkleinern" disabled>−</button>
      <button class="btn ghost" id="btn-zoom-in" title="Vergrößern" disabled>+</button>
      <button class="btn ghost" id="btn-fit-width" title="An Breite anpassen" disabled>Breite</button>
      <button class="btn ghost" id="btn-fit-page" title="Ganze Seite" disabled>Seite</button>
      <span class="sep"></span>
      <button class="btn ghost" id="btn-rotate-left" title="Links drehen" disabled>↺</button>
      <button class="btn ghost" id="btn-rotate-right" title="Rechts drehen" disabled>↻</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div id="thumbnails" class="thumbnails"></div>
    </aside>
    <section class="viewer-host">
      <!-- ONLYOFFICE CViewer mounts its canvas here; cursor target id is required. -->
      <div id="id_viewer" class="viewer"></div>
      <div id="id_target_cursor" class="cursor-target"></div>
      <div id="placeholder" class="placeholder">
        <p>Öffne eine PDF-Datei, um zu beginnen.</p>
        <p class="muted">Läuft vollständig offline im Browser — kein Server-Upload.</p>
      </div>
    </section>
  </main>

  <footer class="app-status" id="status">Engine wird geladen …</footer>

  <script src="/js/main.js" type="module"></script>
</body>
</html>
