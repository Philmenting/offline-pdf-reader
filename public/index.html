<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline PDF Editor</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">Offline PDF Editor</div>

    <div class="toolbar" id="toolbar">
      <!-- File -->
      <label class="btn" for="file-input">PDF öffnen</label>
      <input id="file-input" type="file" accept="application/pdf" hidden>
      <button class="btn" id="btn-save" title="Bearbeitetes PDF herunterladen" disabled>Speichern</button>

      <span class="sep"></span>

      <!-- History -->
      <button class="btn ghost" data-tool="undo" title="Rückgängig" disabled>↶</button>
      <button class="btn ghost" data-tool="redo" title="Wiederholen" disabled>↷</button>

      <span class="sep"></span>

      <!-- Edit tools (toggle group) -->
      <button class="btn ghost tool" data-tool="select"    title="Auswählen / Hand" disabled>Auswahl</button>
      <button class="btn ghost tool" data-tool="edit-text" title="Text bearbeiten" disabled>Text</button>
      <button class="btn ghost tool" data-tool="textbox"   title="Textfeld einfügen" disabled>Textfeld</button>
      <button class="btn ghost tool" data-tool="highlight" title="Markieren" disabled>Marker</button>
      <button class="btn ghost tool" data-tool="underline" title="Unterstreichen" disabled>U̲</button>
      <button class="btn ghost tool" data-tool="strikeout" title="Durchstreichen" disabled>S̶</button>
      <button class="btn ghost tool" data-tool="shape"     title="Form (Rechteck)" disabled>Form</button>
      <button class="btn ghost tool" data-tool="comment"   title="Kommentar" disabled>💬</button>
      <button class="btn ghost tool" data-tool="image"     title="Bild einfügen" disabled>Bild</button>

      <span class="sep"></span>

      <!-- Pages -->
      <button class="btn ghost" data-tool="page-add"    title="Seite hinzufügen" disabled>＋Seite</button>
      <button class="btn ghost" data-tool="page-remove" title="Seite löschen" disabled>－Seite</button>
      <button class="btn ghost" data-tool="rotate-left" title="Seite links drehen" disabled>↺</button>
      <button class="btn ghost" data-tool="rotate-right" title="Seite rechts drehen" disabled>↻</button>

      <span class="sep"></span>

      <!-- View -->
      <button class="btn ghost" data-tool="zoom-out"  title="Verkleinern" disabled>−</button>
      <button class="btn ghost" data-tool="zoom-in"   title="Vergrößern" disabled>+</button>
      <button class="btn ghost" data-tool="fit-width" title="An Breite anpassen" disabled>Breite</button>
      <button class="btn ghost" data-tool="fit-page"  title="Ganze Seite" disabled>Seite</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <!-- Editor thumbnails: the PDF editor (onDocumentContentReady) creates its
           ThumbnailsControl into an element with THIS exact id. Without it, the
           editor's Viewer.thumbnails stays null and asc_EditPage() crashes. -->
      <div id="thumbnails-list" class="thumbnails"></div>
      <!-- Viewer-fallback thumbnails (only used in read-only fallback mode). -->
      <div id="thumbnails" class="thumbnails" hidden></div>
    </aside>
    <section class="viewer-host">
      <!--
        The ONLYOFFICE PDF editor (Asc.PDFEditorApi) replaces this element's
        innerHTML with the full editor page DOM (id_main / id_viewer /
        id_target_cursor / scrollbars …). It must be present and empty before
        the API is constructed.
      -->
      <div id="editor_sdk" class="editor-host"></div>

      <!-- Read-only fallback mount (used only if the editor bundle is missing).
           Its #id_target_cursor is created at runtime to avoid colliding with
           the editor's own #id_target_cursor inside #editor_sdk. -->
      <div id="viewer-container" class="viewer" hidden></div>

      <div id="placeholder" class="placeholder">
        <p>Öffne eine PDF-Datei, um sie zu bearbeiten.</p>
        <p class="muted">Läuft vollständig offline — kein Server-Upload.</p>
      </div>
    </section>
  </main>

  <footer class="app-status" id="status">Engine wird geladen …</footer>

  <script src="/js/ascw3-font-fallback.js"></script>
  <script src="/js/main.js" type="module"></script>
  <script>
    (function installInlineAscw3Fallback() {
      const PATCH_KEY = "__offlinePdfInlineAscw3FallbackPatched";
      const logged = new Set();

      function fontFamily(font) {
        if (!font) return "";
        if (typeof font.GetFamilyName === "function") return font.GetFamilyName() || "";
        if (font.m_pFaceInfo && font.m_pFaceInfo.family_name) return font.m_pFaceInfo.family_name;
        return font.m_wsFontName || "";
      }

      function isNormalTextCodePoint(codePoint) {
        return typeof codePoint === "number"
          && codePoint >= 0x20
          && !(codePoint >= 0xE000 && codePoint <= 0xF8FF)
          && (codePoint <= 0x024F
            || (codePoint >= 0x0370 && codePoint <= 0x052F)
            || (codePoint >= 0x1E00 && codePoint <= 0x1EFF)
            || (codePoint >= 0x2000 && codePoint <= 0x206F)
            || (codePoint >= 0x20A0 && codePoint <= 0x20CF));
      }

      function pickedFamily(codePoint) {
        const picker = window.AscFonts && window.AscFonts.FontPickerByCharacter;
        if (picker && typeof picker.getFontBySymbol === "function") {
          try {
            const picked = picker.getFontBySymbol(codePoint);
            if (picked && picked !== "ASCW3") return picked;
          } catch (e) { /* ignore */ }
        }
        return "Liberation Sans";
      }

      function loadRealFont(tm, codePoint) {
        if (!tm || typeof tm.SetFontInternal !== "function") return null;
        const size = (window.AscFonts && window.AscFonts.MEASURE_FONTSIZE) || 10;
        const last = tm.m_oLastFont || {};
        const style = typeof last.SetUpStyle === "number" ? last.SetUpStyle : 0;
        const candidates = [
          pickedFamily(codePoint),
          "Liberation Sans",
          "DejaVu Sans",
          "FreeSans",
          "Liberation Serif",
          "DejaVu Serif",
          "FreeSerif"
        ];
        const seen = new Set();
        for (const family of candidates) {
          if (!family || family === "ASCW3" || seen.has(family)) continue;
          seen.add(family);
          let font = null;
          try { font = tm.SetFontInternal(family, size, style, 72); } catch (e) { font = null; }
          if (font && typeof font.GetGIDByUnicode === "function" && font.GetGIDByUnicode(codePoint)) {
            return { Font: font, CodePoint: codePoint };
          }
        }
        return null;
      }

      function install() {
        const tm = window.AscCommon && window.AscCommon.g_oTextMeasurer;
        if (!tm || tm[PATCH_KEY] || typeof tm.GetFontBySymbol !== "function") return false;

        const origGetFontBySymbol = tm.GetFontBySymbol;
        tm.GetFontBySymbol = function (codePoint, oPreferredFont, isForcePreferred) {
          const result = origGetFontBySymbol.call(this, codePoint, oPreferredFont, isForcePreferred);
          if (fontFamily(result && result.Font) === "ASCW3" && isNormalTextCodePoint(codePoint)) {
            const replacement = loadRealFont(this, codePoint);
            if (replacement) {
              const family = fontFamily(replacement.Font);
              const key = codePoint + ":" + family;
              if (!logged.has(key)) {
                logged.add(key);
                console.warn(`[fonts] inline ASCW3 fallback: U+${codePoint.toString(16)} -> "${family}"`);
              }
              return replacement;
            }
          }
          return result;
        };

        if (typeof tm.CheckUnicodeInCurrentFont === "function") {
          const origCheck = tm.CheckUnicodeInCurrentFont;
          tm.CheckUnicodeInCurrentFont = function (codePoint) {
            const current = this.m_oManager && this.m_oManager.m_pFont;
            if (fontFamily(current) === "ASCW3" && isNormalTextCodePoint(codePoint)) return false;
            return origCheck.call(this, codePoint);
          };
        }

        tm[PATCH_KEY] = true;
        console.log("[fonts] inline ASCW3 fallback patch installed");
        return true;
      }

      const timer = setInterval(() => {
        if (install()) clearInterval(timer);
      }, 250);
      setTimeout(() => clearInterval(timer), 120000);
    })();
  </script>
</body>
</html>
